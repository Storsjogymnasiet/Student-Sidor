<!DOCTYPE html>
<html xmlns="http://w3.org" lang="sv" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css" />
        <link rel="shortcut icon" type="image/png" href="icon.png" />
        <title>WEBB100X-mide0720</title>
        <style type="text/css">
            html,body{
                margin: 0;
                padding: 0;
                position: relative;
                min-height: 100vh;
            }
            main{
                position: absolute;
                top: 40px;
                left: 0;
                width: 100%;
                z-index: 10;
            }
            #cat-container{
                font-family: monospace;
                white-space: pre;
                font-size: 14px;
                line-height: 1.2;
                width: 46ch; 
                margin: 0 auto;
                padding-top: 140px;
                color: #444;
                position: relative;
                z-index: 2;
            }
            .cat-segment{
                display: block;
            }
            #cat-sentinel{
                height: 1px;
            }
            ::-webkit-scrollbar, ::-webkit-scrollbar-track, ::-webkit-scrollbar-thumb{
                width: 0px;
                height: 0px;
                background: transparent;
            }
        </style>
    </head>
    <body>
        <main>  
            <h1 class="center">Välkommen till WEBB100X-mide0720</h1>
            <div class="center-object">
                <p>Uppgifter:</p>
                <ul>
                    <li><a href="camping/">Camping</a></li>
                    <li><a href="pixar/">Pixar</a></li>
                </ul>
            </div>
        </main>
        <div id="cat-container">
            <div id="cat-leg-zone"></div>
            <div id="cat-sentinel"></div>
        </div>
        <script type="text/javascript">
            const legZone=document.getElementById('cat-leg-zone');
            const sentinel=document.getElementById('cat-sentinel');
            const body=document.createElement('div');
            body.className='cat-segment';
            body.innerHTML=`                      _
            __       / |
            \\ "-..--'_4|_
 _._____     \\ _  _(C "._'._
((^     '"-._( O_ O "._\` '. \\
 \`"'--._     \\  y_     \\   \\|
        '-._  \\_ _  __.=-.__,\\_
            \`'-(" ,("___       \\,_____
                (_,("___     .-./     '
                |   C'___    (5)
                /    \`\`  '---'-'._\`\`\`
               |     \`\`\`    |\`    '"-._
               |    \`\`\`\`    \\-.\`
               |    \`\`\`\`    |  "._ \`\`
               /    \`\`\`\`    |     '-.__
              |     \`\`\`     |
              |    \`\`\`\`    /`;
            legZone.appendChild(body);
            function addLegs(amount=30){
                const fragment=document.createDocumentFragment();
                for(let i=0;i<amount;i++){
                    const div=document.createElement('div');
                    div.className='cat-segment';
                    div.textContent="              |    \`\`\`     |";
                    fragment.appendChild(div);
                }
                legZone.appendChild(fragment);
            }
            addLegs(Math.ceil(window.innerHeight/16.8)+20);
            const observer=new IntersectionObserver((entries)=>{
                if(entries[0].isIntersecting){
                    addLegs(40);
                }
            },{rootMargin:'400px'});
            observer.observe(sentinel);
        </script>
    </body>
</html>

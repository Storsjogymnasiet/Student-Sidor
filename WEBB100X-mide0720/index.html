<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="sv" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css" />
        <link rel="shortcut icon" type="image/png" href="icon.png" />
        <title>WEBB100X-mide0720</title>
        <style type="text/css">
            html, body {
                margin: 0;
                padding: 20px;
            }
            #cat-container {
                font-family: monospace;
                white-space: pre;
                font-size: 14px;
                line-height: 1.2;
                width: 46ch; 
                margin: 0 auto;
            }
            .cat-segment {
                display: block;
            }
            #cat-sentinel {
                height: 1px;
            }
            ::-webkit-scrollbar, ::-webkit-scrollbar-track, ::-webkit-scrollbar-thumb {
              width: 0px;
              height: 0px;
              border-radius: 0px;
              background: transparent;
            }
        </style>
    </head>
    <body>
        <div class="center">
            <h1>Välkommen till WEBB100X-mide0720</h1>
        </div>
        <div id="cat-container">
            <div id="cat-leg-zone"></div>
            <div id="cat-sentinel"></div>
        </div>
        <script type="text/javascript">
            const legZone=document.getElementById('cat-leg-zone');
            const sentinel=document.getElementById('cat-sentinel');
            const body=document.createElement('div');
            body.className='cat-segment';
            body.innerHTML=`                      _
            __       / |
            \\ "-..--'_4|_
 _._____     \\ _  _(C "._'._
((^     '"-._( O_ O "._\` '. \\
 \`"'--._     \\  y_     \\   \\|
        '-._  \\_ _  __.=-.__,\\_
            \`'-(" ,("___       \\,_____
                (_,("___     .-./     '
                |   C'___    (5)
                /    \`\`  '---'-'._\`\`\`
               |     \`\`\`    |\`    '"-._
               |    \`\`\`\`    \\-.\`
               |    \`\`\`\`    |  "._ \`\`
               /    \`\`\`\`    |     '-.__
              |     \`\`\`     |
              |    \`\`\`\`    /`;
            legZone.appendChild(body);
            function addLegs(amount=30){
                const fragment=document.createDocumentFragment();
                for(let i=0;i<amount;i++){
                    const div=document.createElement('div');
                    div.className='cat-segment';
                    div.textContent="              |    \`\`\`     |";
                    fragment.appendChild(div);
                }
                legZone.appendChild(fragment);
            }
            addLegs(Math.ceil(window.innerHeight/16.8)+20);
            const observer=new IntersectionObserver((entries)=>{
                if(entries[0].isIntersecting){
                    addLegs(40);
                }
            },{rootMargin:'400px'});
            observer.observe(sentinel);
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>main.js exempel</title>
        <script defer src="../main.js#.."></script>
    </head>
    <body>
        <p>Hej, Världen!</p>
        <!--hover/onhover: visar text innuti onhover när musen hovrar över hover elementet -->
        <hover>
            <p>Hovra över mig. &#9432;</p>
            <onhover>
                <p>Du hovrar över texten!</p>
            </onhover>
        </hover>
        <!--animated-details: details taggen fast animerad -->
        <animated-details>
            <span slot="summary">Klicka mig!</span>
            <p>Du klickade på mig!</p>
        </animated-details>
    </body>
</html>

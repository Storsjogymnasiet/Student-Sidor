<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus timer</title>
    <link rel="stylesheet" href="gam.css">




    <div class="pomodoro container"></div>
    <h1> focus timer</h1>

    <button id="work mode" class="mode-btn active">work (21m)</button>
    <button id="break mode" class="mode-break">break (5m)</button>
    </div>



    <div class="timer-display"></div>
    <span id="minutes">21</span>:<span id="seconds">00</span>

    </div>

    <button id="start-btn" class="control-btn">start</button>
    <button id="pause-btn" class="control-btn" disabled>pause</button>
    <button id="reset-btn" class="control-btn" onclick="resetTimer()">reset</button>

    </div>
    </div>
    <script src="gam.js"></script>
</head>

<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storsjögymnasiet — Studentportaler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="https://www.storsjogymnasiet.se/wp-content/uploads/2021/03/nyloggaSvart-01.png" alt="StorsjöGymnasiet">
        <p>Alla publicerade elevsidor.</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Sök efter projekt..." onkeyup="filterSites()">
    </div>

    <main class="container" id="siteGrid">
        <div class="no-results" id="noResults">Laddar sidor...</div>
    </main>

    <footer>
        <p>Storsjögymnasiet — Automatisk portal via GitHub Actions</p>
    </footer>

    <script>
        async function loadSites() {
            const grid = document.getElementById('siteGrid');
            const noResults = document.getElementById('noResults');

            try {
                const response = await fetch('https://api.github.com/repos/Storsjogymnasiet/Student-Sidor/contents');

                if (!response.ok) {
                    throw new Error('Kunde inte hämta innehåll');
                }

                const items = await response.json();

                // Filtrera ut mappar (exkludera dolda filer som börjar med '.')
                const folders = items.filter(item =>
                    item.type === 'dir' && !item.name.startsWith('.')
                );

                if (folders.length === 0) {
                    noResults.style.display = 'block';
                    noResults.textContent = 'Inga publicerade sidor hittades ännu.';
                    return;
                }

                grid.innerHTML = ''; // Rensa laddningsmeddelandet

                // Hämta meta.json parallellt för alla mappar
                const cardPromises = folders.map(async (folder) => {
                    let displayName = folder.name
                        .replace(/[-_]/g, ' ')
                        .replace(/\b\w/g, char => char.toUpperCase());
                    let author = '';

                    try {
                        // Försök hämta meta.json från mappen
                        const metaRes = await fetch(`./${folder.name}/meta.json`);
                        if (metaRes.ok) {
                            const metaData = await metaRes.json();
                            if (metaData.title) displayName = metaData.title;
                            if (metaData.author) author = metaData.author;
                        }
                    } catch (e) {
                        // Om meta.json saknas eller är felaktig används mappnamnet
                    }

                    // Skapa kort-elementet
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = `./${folder.name}/`;

                    card.innerHTML = `
                <div>
                    <div class="card-title">${displayName}</div>
                    <div class="card-path">/${folder.name}/ ${author ? `• ${author}` : ''}</div>
                </div>
                <div class="card-arrow">
                    Besök sida &rarr;
                </div>
            `;
                    return card;
                });

                // Vänta tills alla meta-filer lästs in och lägg till i DOM:en
                const cards = await Promise.all(cardPromises);
                cards.forEach(card => grid.appendChild(card));

            } catch (error) {
                console.error(error);
                noResults.style.display = 'block';
                noResults.textContent = 'Ett fel uppstod när sidorna skulle laddas.';
            }
        }

        function filterSites() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            let hasMatch = false;

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(input)) {
                    card.style.display = 'flex';
                    hasMatch = true;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('noResults').style.display = hasMatch ? 'none' : 'block';
        }

        loadSites();
    </script>
</body>

</html>
